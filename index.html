
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Mehsin ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff416c,#ff4b2b,#7b61ff);
overflow:hidden;
color:white;
}

/* main card */

.container{
width:420px;
padding:40px;
border-radius:25px;
background:rgba(255,255,255,0.12);
backdrop-filter:blur(15px);
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,0.3);
}

/* title */

h1{
font-size:34px;
margin-bottom:20px;
}

/* slider */

.slider{
width:100%;
height:350px;
border-radius:15px;
overflow:hidden;
position:relative;
display:flex;
justify-content:center;
align-items:center;
background:black;
}

.slider img{
position:absolute;
max-width:100%;
max-height:100%;
object-fit:contain;
opacity:0;
transition:1s;
}

.slider img.active{
opacity:1;
}

/* button */

button{
margin-top:20px;
padding:12px 30px;
border:none;
border-radius:30px;
background:white;
color:#ff416c;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.1);
}

/* message */

#message{
margin-top:20px;
display:none;
font-size:18px;
line-height:1.5;
}

/* floating hearts */

.heart{
position:absolute;
color:white;
font-size:20px;
animation:float 6s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh)}
100%{transform:translateY(-10vh)}
}

</style>
</head>

<body>

<div class="container">

<h1>I Love You Mehsin ❤️</h1>

<div class="slider">

<img src="meh2.img"> 
<img src="meh3.img">
<img src="meh4.jpeg">
<img src="meh5.img">


</div>

<button onclick="showMessage()">Open My Heart</button>

<div id="message">
Mehsin ❤️  
You are the most beautiful part of my life.  
Every moment with you feels special.  
No matter what happens, my heart will always choose you.
</div>

</div>

<script>

/* slider */

let slides=document.querySelectorAll(".slider img")
let index=0

setInterval(()=>{
slides[index].classList.remove("active")
index=(index+1)%slides.length
slides[index].classList.add("active")
},3000)

/* message */

function showMessage(){
document.getElementById("message").style.display="block"
}

/* floating hearts */

setInterval(()=>{
let heart=document.createElement("div")
heart.className="heart"
heart.innerHTML="❤️"
heart.style.left=Math.random()*100+"vw"
heart.style.fontSize=(10+Math.random()*25)+"px"
heart.style.animationDuration=(3+Math.random()*3)+"s"
document.body.appendChild(heart)

setTimeout(()=>{heart.remove()},6000)

},300)

</script>

</body>
</html>
